[sources.syslog_udp]
type = "socket"
mode = "udp"
address = "0.0.0.0:514"

[sources.syslog_tcp]
type = "socket"
mode = "tcp"
address = "0.0.0.0:514"

[transforms.parse_syslog]
type = "remap"
inputs = ["syslog_udp", "syslog_tcp"]
source = '''
  raw_msg = .message
  parsed, err = parse_syslog(.message)
  ts = now()
  hostname = ""
  if err == null {
    ts = parsed.timestamp
    hostname = parsed.hostname
    raw_msg = parsed.message
  }
  kv = parse_key_value(raw_msg, key_value_delimiter: "=", field_delimiter: " ") ?? {}
  . = {}
  . = set!(., ["@timestamp"], format_timestamp!(ts, "%+"))
  .source = "firewall"
  .vendor = "firewall"
  .product = "network"
  .event_type = "network"
  .event_subtype = "syslog"
  .severity = 5
  .msg = kv.msg || ""
  .src_ip = kv.src || ""
  .dst_ip = kv.dst || ""
  .protocol = kv.proto || ""
  .src_port = to_int(kv.sport) ?? 0
  .dst_port = to_int(kv.dport) ?? 0
  .host = hostname
  .raw = raw_msg
'''

[sinks.backend]
type = "http"
inputs = ["parse_syslog"]
uri = "http://backend:3000/api/ingest"
encoding.codec = "json"
framing.method = "newline_delimited"
batch.max_events = 1

[sinks.backend.auth]
strategy = "bearer"
token = "${VECTOR_INGEST_TOKEN}"

[sinks.backend.request.headers]
X-Source = "firewall"

[sinks.dashboard]
type = "console"
inputs = ["parse_syslog"]
encoding.codec = "json"
