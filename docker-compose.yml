services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - JWT_SECRET=${JWT_SECRET}
      - OPENSEARCH_URL=${OPENSEARCH_URL}
      - OPENSEARCH_USER=${OPENSEARCH_USER}
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-7}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - SEARCH_CACHE_TTL_SECONDS=${SEARCH_CACHE_TTL_SECONDS:-4}
    depends_on:
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  vector:
    image: timberio/vector:latest-distroless-libc
    command: ["--config", "/etc/vector/vector.toml"]
    ports:
      - "514:514/udp"
      - "514:514/tcp"
    volumes:
      - ./ingest/vector.toml:/etc/vector/vector.toml:ro
    environment:
      - VECTOR_LOG=${VECTOR_LOG:-info}
      - VECTOR_INGEST_TOKEN=${VECTOR_INGEST_TOKEN}
      - VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION=true
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  opensearch:
    image: opensearchproject/opensearch:latest
    environment:
      - bootstrap.memory_lock=true
      - "discovery.type=single-node"
      - "plugins.security.disabled=true"
      - "OPENSEARCH_JAVA_HOME=/usr/share/opensearch/jdk"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD}"
      - "OPENSEARCH_JAVA_OPTS=-XX:+UnlockExperimentalVMOptions -XX:+UseContainerSupport -Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    environment:
      - "DISABLE_SECURITY_DASHBOARDS_PLUGIN=true"
    ports:
      - "5601:5601"
    volumes:
      - ./deploy/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["npx", "tsx", "workers/index.ts"]
    environment:
      - OPENSEARCH_URL=${OPENSEARCH_URL}
      - OPENSEARCH_USER=${OPENSEARCH_USER}
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-7}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - ENRICHMENT_INTERVAL_MS=${ENRICHMENT_INTERVAL_MS:-15000}
      - ENRICHMENT_BATCH_SIZE=${ENRICHMENT_BATCH_SIZE:-100}
      - ENRICHMENT_RATE_LIMIT_PER_SEC=${ENRICHMENT_RATE_LIMIT_PER_SEC:-100}
      - ALERT_CHECK_INTERVAL_MS=${ALERT_CHECK_INTERVAL_MS:-10000}
    depends_on:
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src/config:/app/src/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e 'process.exit(0)'"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  opensearch-data:
  redis-data:
