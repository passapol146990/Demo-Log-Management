name: Deploy (Self-Hosted)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build and restart services
        run: ./run.sh up

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            if curl -fs http://localhost:3000/api/auth/login -o /dev/null -w "%{http_code}" | grep -qE "^(200|400|401|405)$"; then
              echo "Backend is up"
              exit 0
            fi
            echo "Waiting for backend... ($i/15)"
            sleep 5
          done
          echo "Backend failed health check"
          docker compose logs --tail=100 backend
          exit 1
